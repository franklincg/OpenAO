name: FAST_MONEY validation

on:
  push:
    branches:
      - fastmoney-openao17-ping-activity

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Deterministic client activity regression
        working-directory: server
        run: pnpm run test:client-activity
      - name: Lint
        working-directory: server
        run: pnpm run lint
      - name: Typecheck
        working-directory: server
        run: pnpm exec tsc --noEmit
