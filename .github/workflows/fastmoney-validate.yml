name: FAST_MONEY focused validation

on:
  push:
    branches:
      - fastmoney-openao16-ready

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Focused regression
        working-directory: server
        run: pnpm run test:connection-policy
      - name: Lint
        working-directory: server
        run: pnpm run lint
      - name: Typecheck
        working-directory: server
        run: pnpm exec tsc --noEmit
      - name: Build
        working-directory: server
        run: pnpm run build
